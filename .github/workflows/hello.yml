name: Hello World Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Hello Message
        run: echo "Hello, World! Welcome to GitHub Actions."

      - name: Print Timestamp
        run: date
